name: CI — Python code quality checks and linting

on:
  push:
    branches: ["**"]
    paths:
      - "**.py"
      - "mypy.ini"
      - "tools/requirements.txt"
  pull_request:
    branches: ["**"]
    paths:
      - "**.py"
      - "mypy.ini"
      - "tools/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r tools -q

  mypy:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: [bandit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install mypy and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -r tools/requirements.txt

      - name: Install missing type stubs
        run: |
          mypy --install-types --non-interactive . || true

      - name: Run mypy
        run: |
          mypy --config-file mypy.ini .

  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    needs: [mypy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff version
          ruff check .

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    needs: [ruff]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'

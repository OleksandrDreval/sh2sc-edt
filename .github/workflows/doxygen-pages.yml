# .github/workflows/doxygen-pages.yml
# SH2SC-EDT — Automatic Doxygen documentation build and GitHub Pages deployment.
# Triggered on push to main when any source file or documentation changes.

name: Doxygen — Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - develop-den
    paths:
      - "TransmitterNode/**/*.h"
      - "TransmitterNode/**/*.ino"
      - "TransmitterNode/**/*.cpp"
      - "ReceiverNode/**/*.h"
      - "ReceiverNode/**/*.ino"
      - "ReceiverNode/**/*.cpp"
      - "docs/**/*.md"
      - "Doxyfile"
      - ".github/workflows/doxygen-pages.yml"

  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Generate Doxygen HTML and publish to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive   # required: pulls doxygen-awesome-css submodule

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          doxygen --version
          dot -V

      - name: Pre-process Mermaid blocks for Doxygen
        # Converts ```mermaid ... ``` blocks to @mermaid ... @endmermaid aliases so
        # Doxygen renders them via the Mermaid.js CDN injected in footer.html.
        # Runs only on the CI runner — the repository source is never modified.
        run: |
          perl -0777 -pi -e 's/```mermaid(.*?)```/@mermaid$1@endmermaid/gs' README.md README_uk.md

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Check for warnings
        run: |
          if [ -s docs_output/doxygen_warnings.log ]; then
            echo "::warning::Doxygen produced warnings — see docs_output/doxygen_warnings.log"
            cat docs_output/doxygen_warnings.log
          else
            echo "No Doxygen warnings."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs_output/html
          publish_branch: gh-pages
          commit_message: "docs: auto-deploy Doxygen for ${{ github.sha }}"
          force_orphan: true
